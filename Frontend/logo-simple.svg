<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="simpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A4DA0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B4D8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Minimalist key with L and R -->
  <g transform="translate(50, 45)">
    <!-- Key head with R -->
    <circle cx="0" cy="-12" r="10" fill="none" stroke="url(#simpleGradient)" stroke-width="3" />
    <text x="0" y="-8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
          fill="url(#simpleGradient)" text-anchor="middle">R</text>
    
    <!-- Key shaft forming L -->
    <line x1="0" y1="-2" x2="0" y2="18" stroke="url(#simpleGradient)" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="18" x2="-8" y2="18" stroke="url(#simpleGradient)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Key teeth -->
    <line x1="0" y1="4" x2="6" y2="4" stroke="url(#simpleGradient)" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="9" x2="4" y2="9" stroke="url(#simpleGradient)" stroke-width="2" stroke-linecap="round" />
  </g>
  
  <!-- LogRes text -->
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        fill="#0A4DA0" text-anchor="middle" letter-spacing="1">LogRes</text>
</svg>