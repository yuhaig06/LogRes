<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Tạo Tài Khoản</title>
</head>
<body>
    <main class="container-fluid p-0">
        <div class="stars"></div>

        <section class="visual-panel" aria-hidden="true"></section>

        <section class="auth-panel">
            <div class="logo-container">
                <img src="logo-simple.svg" alt="LogRes Logo" class="logo">
            </div>
            <form id="registerForm" class="auth-card">
                <h1>Tạo Tài Khoản</h1>
                <p class="mode-label" id="modeLabel">Người Lớn</p>
                <p class="subtitle">Đăng ký để đăng nhập vào hệ thống</p>

                <label for="username" id="usernameLabel">
                    Email / Số điện thoại
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Nhập email hoặc số điện thoại"
                    autocomplete="username"
                >

                <label for="password">
                    Mật khẩu
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ít nhất 6 ký tự"
                    autocomplete="new-password"
                >

                <label for="confirmPassword">
                    Xác nhận mật khẩu
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Nhập lại mật khẩu"
                    autocomplete="new-password"
                >

                <p id="helpText" aria-live="polite"></p>

                <div class="order">
                    <button type="button" id="childBtn">Trẻ Em</button>
                    <button type="button" id="adultBtn">Người Lớn</button>
                    <button type="button" id="elderBtn">Người Già</button>
                </div>

                <button
                    type="submit"
                    class="login-btn"
                    id="submitRegisterBtn"
                >
                    Tạo tài khoản
                </button>

                <button
                    type="button"
                    class="back-btn"
                    id="backToLoginBtn"
                >
                    Quay lại đăng nhập
                </button>
            </form>
        </section>
    </main>

    <script src="register.js" defer></script>
</body>
</html>
