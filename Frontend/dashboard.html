<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chatbot.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Dashboard</title>
</head>
<body>
    <div class="chatbot">
        <button
            type="button"
            class="chat-toggle"
            id="chatToggle"
            aria-label="Mở trợ giúp"
        >
            💬
        </button>

        <div
            class="chat-box"
            id="chatBox"
            aria-hidden="true"
        >
            <div class="chat-header">
                <strong>Trợ giúp</strong>

                <button
                    type="button"
                    class="chat-close"
                    id="chatClose"
                    aria-label="Đóng trợ giúp"
                >
                    ×
                </button>
            </div>

            <div class="chat-content">
                <p id="chatMessage">
                    Xin chào! Tôi có thể hỗ trợ bạn.
                </p>
            </div>

            <div class="chat-input-area">
                <input
                    type="text"
                    id="chatInput"
                    placeholder="Nhập câu hỏi..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="chatSend"
                >
                    Gửi
                </button>
            </div>
        </div>
    </div>

    <main class="container-fluid p-0">
        <div class="stars"></div>
        
        <section class="dashboard-panel">
            <div class="dashboard-content">
                <div class="dashboard-header">
                    <h1 id="dashboardTitle">Xin chào!</h1>
                    <div class="header-actions">
                        <button type="button" class="admin-btn" id="adminBtn" style="display: none;">Quản trị</button>
                        <button type="button" class="logout-btn" id="logoutBtn">Đăng xuất</button>
                    </div>
                </div>

                <div class="user-info">
                    <div class="info-item">
                        <label>Tên người dùng:</label>
                        <span id="userInfoUsername">-</span>
                    </div>
                    <div class="info-item">
                        <label>Chế độ:</label>
                        <span id="userInfoMode">-</span>
                    </div>
                </div>

                <div id="supervisionBanner" class="supervision-banner" hidden>
                    Phiên trẻ em đang được giám sát bởi phụ huynh. Bé dưới 18 tuổi dùng tài khoản cha mẹ.
                </div>

                <div class="dashboard-body" id="dashboardBody">
                    <p id="dashboardMessage">Chào mừng bạn đến với hệ thống!</p>
                </div>

                <section id="familyLink" class="family-link" hidden>
                    <h2>Family Link</h2>
                    <p>Thêm hồ sơ trẻ em dưới 18 tuổi. Bé đăng nhập bằng chính tài khoản phụ huynh này.</p>

                    <div class="family-add">
                        <input
                            type="text"
                            id="childNameInput"
                            placeholder="Tên của bé"
                            autocomplete="off"
                        >
                        <button type="button" id="addChildBtn">Thêm hồ sơ bé</button>
                    </div>

                    <p id="familyHelpText" aria-live="polite"></p>
                    <ul id="childrenList" class="children-list"></ul>
                </section>
            </div>
        </section>
    </main>

    <script src="dashboard.js" defer></script>
</body>
</html>
