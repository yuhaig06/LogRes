<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chatbot.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Login</title>
</head>
<body>
    <div class="chatbot">
    <button
        type="button"
        class="chat-toggle"
        id="chatToggle"
        aria-label="Mở trợ giúp"
    >
        💬
    </button>

    <div
        class="chat-box"
        id="chatBox"
        aria-hidden="true"
    >
        <div class="chat-header">
            <strong>Trợ giúp</strong>

            <button
                type="button"
                class="chat-close"
                id="chatClose"
                aria-label="Đóng trợ giúp"
            >
                ×
            </button>
        </div>

        <div class="chat-content">
            <p id="chatMessage">
                Xin chào! Tôi có thể hỗ trợ bạn đăng nhập.
            </p>
        </div>

        <div class="chat-input-area">
            <input
                type="text"
                id="chatInput"
                placeholder="Nhập câu hỏi..."
                autocomplete="off"
            >

            <button
                type="button"
                id="chatSend"
            >
                Gửi
            </button>
        </div>
    </div>
</div>
    <main class="container-fluid p-0">
        <div class="stars"></div>
        
        <section class="visual-panel">
            <div class="left">
                
            </div>
        </section>

        <section class="login-panel">
            <div class="right">
                <form class="auth-card" action="/login" method="post">
                    <h1>Đăng Nhập</h1>
                    <p class="mode-label" id="modeLabel">Người Lớn</p>
                    <p class="subtitle">Chào mừng bạn quay trở lại</p>
                    <p class="parent-hint" id="parentHint">
                        Bé dưới 18 tuổi phải dùng tài khoản phụ huynh. Nếu cần trợ giúp, hãy nhờ cha mẹ.
                    </p>

                    <label for="username" id="usernameLabel">
                        Email / Số điện thoại
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Nhập email hoặc số điện thoại"
                        autocomplete="username"
                    >

                    <label for="password" id="passwordLabel">
                        Mật khẩu
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Nhập mật khẩu"
                        autocomplete="current-password"
                    >

                    <p id="helpText" aria-live="polite"></p>

                    <div class="order">
                        <button type="button" id="childBtn">Trẻ Em</button>
                        <button type="button" id="adultBtn">Người Lớn</button>
                        <button type="button" id="elderBtn">Người Già</button>
                    </div>

                    <button
                        type="submit"
                        class="login-btn"
                        id="loginBtn"
                    >
                        Đăng Nhập
                    </button>

                    <div class="auth-links">
                        <button
                            type="button"
                            class="forgot-password-btn"
                            id="registerBtn"
                        >
                            Tạo tài khoản
                        </button>

                        <button
                            type="button"
                            class="forgot-password-btn"
                            id="forgotPasswordBtn"
                        >
                            Quên mật khẩu?
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="index.js" defer></script>
</body>
</html>
