<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Admin Dashboard</title>
</head>
<body>
    <main class="container-fluid p-0">
        <div class="stars"></div>
        
        <section class="admin-panel">
            <div class="admin-content">
                <div class="admin-header">
                    <h1>Quản Lý Tài Khoản</h1>
                    <button type="button" class="logout-btn" id="logoutBtn">Đăng xuất</button>
                </div>

                <div class="admin-body">
                    <div class="admin-actions">
                        <button type="button" class="refresh-btn" id="refreshBtn">Làm mới danh sách</button>
                        <button type="button" class="back-btn" id="backToDashboardBtn">Quay lại Dashboard</button>
                    </div>

                    <div id="loadingMessage" class="loading-message">Đang tải...</div>

                    <div id="errorMessage" class="error-message"></div>

                    <div id="usersTable" class="users-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Tên đăng nhập</th>
                                    <th>Chế độ</th>
                                    <th>Lần sai</th>
                                    <th>Trạng thái</th>
                                    <th>Admin</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="admin.js" defer></script>
</body>
</html>
