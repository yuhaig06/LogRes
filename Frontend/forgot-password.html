<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Quên Mật Khẩu</title>
</head>
<body>
    <main class="container-fluid p-0">
        <div class="stars"></div>

        <section class="visual-panel" aria-hidden="true"></section>

        <section class="forgot-password-panel">
            <form id="forgotPasswordForm" class="auth-card">
                <h1>Quên Mật Khẩu</h1>
                <p class="mode-label" id="modeLabel">Người Lớn</p>
                <p class="subtitle">Khôi phục mật khẩu của bạn</p>

                <div id="step1" class="auth-step">
                    <label for="username" id="usernameLabel">
                        Email / Số điện thoại
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Nhập email hoặc số điện thoại"
                        autocomplete="username"
                    >

                    <p id="helpText" aria-live="polite"></p>

                    <div class="order">
                        <button type="button" id="childBtn">Trẻ Em</button>
                        <button type="button" id="adultBtn">Người Lớn</button>
                        <button type="button" id="elderBtn">Người Già</button>
                    </div>

                    <button
                        type="button"
                        class="login-btn"
                        id="sendOtpBtn"
                    >
                        Gửi OTP
                    </button>

                    <button
                        type="button"
                        class="back-btn"
                        id="backToLoginBtn"
                    >
                        Quay lại đăng nhập
                    </button>
                </div>

                <div id="step2" class="auth-step" style="display: none;">
                    <label for="otp">
                        Nhập mã OTP
                    </label>

                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        placeholder="Nhập 6 số OTP"
                        maxlength="6"
                        autocomplete="one-time-code"
                    >

                    <p id="otpHelpText" aria-live="polite"></p>

                    <button
                        type="button"
                        class="login-btn"
                        id="verifyOtpBtn"
                    >
                        Xác nhận OTP
                    </button>

                    <button
                        type="button"
                        class="resend-btn"
                        id="resendOtpBtn"
                    >
                        Gửi lại OTP
                    </button>

                    <button
                        type="button"
                        class="back-btn"
                        id="backToStep1Btn"
                    >
                        Quay lại
                    </button>
                </div>

                <div id="step3" class="auth-step" style="display: none;">
                    <label for="newPassword">
                        Mật khẩu mới
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        placeholder="Nhập mật khẩu mới (ít nhất 6 ký tự)"
                        autocomplete="new-password"
                    >

                    <label for="confirmPassword">
                        Xác nhận mật khẩu mới
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Nhập lại mật khẩu mới"
                        autocomplete="new-password"
                    >

                    <p id="passwordHelpText" aria-live="polite"></p>

                    <button
                        type="button"
                        class="login-btn"
                        id="resetPasswordBtn"
                    >
                        Đặt lại mật khẩu
                    </button>

                    <button
                        type="button"
                        class="back-btn"
                        id="backToLoginBtn2"
                    >
                        Quay lại đăng nhập
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script src="forgot-password.js" defer></script>
</body>
</html>
