<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="keyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A4DA0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0077B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B4D8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main key shape combining L and R -->
  <g transform="translate(100, 90)">
    <!-- Key head (R shape integration) -->
    <circle cx="0" cy="-30" r="22" fill="none" stroke="url(#keyGradient)" stroke-width="7" />
    
    <!-- R letter formed by key head details -->
    <path d="M -8 -40 L 8 -40 L 8 -25 L 0 -25 L 8 -15 L 0 -5 L -8 -15 L -8 -40" 
          fill="none" stroke="url(#keyGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Key shaft forming vertical L -->
    <line x1="0" y1="-8" x2="0" y2="35" stroke="url(#keyGradient)" stroke-width="7" stroke-linecap="round" />
    
    <!-- Key foot forming horizontal L -->
    <line x1="0" y1="35" x2="-18" y2="35" stroke="url(#keyGradient)" stroke-width="7" stroke-linecap="round" />
    
    <!-- Smart key teeth (modern touch) -->
    <line x1="0" y1="8" x2="14" y2="8" stroke="url(#keyGradient)" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="18" x2="10" y2="18" stroke="url(#keyGradient)" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="28" x2="6" y2="28" stroke="url(#keyGradient)" stroke-width="5" stroke-linecap="round" />
  </g>
  
  <!-- LogRes branding -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
        fill="#0A4DA0" text-anchor="middle" letter-spacing="3">LogRes</text>
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="10" font-weight="normal" 
        fill="#00B4D8" text-anchor="middle" letter-spacing="1">SECURE ACCESS</text>
</svg>